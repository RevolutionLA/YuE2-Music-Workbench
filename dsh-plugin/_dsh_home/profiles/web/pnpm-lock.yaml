lockfileVersion: '9.0'

settings:
  autoInstallPeers: false
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      yue2-lab-plugin:
        specifier: file:../../..
        version: file:../../..

packages:

  yue2-lab-plugin@file:../../..:
    resolution: {directory: ../../.., type: directory}
    peerDependencies:
      '@deepseek-ai/cordis': '*'

snapshots:

  yue2-lab-plugin@file:../../..: {}
