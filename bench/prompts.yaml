# 生成质量基准 · 固定样本集（issue #12）
#
# 规矩：写进来就永不改 —— 改了就没有历史可比性。要加样本，另开一份 prompts-*.yaml。
# 档位固定 draft（off / 8 步）：5 首约 10 分钟，保证"每版都跑得起"。
# 固定 seed 是唯一的可复现抓手：模型输出仍有随机性，但同 seed 同参数下版本间可比。
#
# 变量说明：
#   seed   固定整数，永不改
#   cot    固定 off（基准不带谱；melody 只用于翻唱组）
#   steps  固定 8
#   cfg_scale 固定 1.0
#   enabled=false 的组不进基准，原因写在 reason 里

set: v1

